<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MetaCoin Trust-Ledger Console (research-stage, zero-value)</title>
    <script src="node_modules/openmct/dist/openmct.js"></script>
</head>
<body>
    <script src="plugin.js"></script>
    <script>
        openmct.setAssetPath('node_modules/openmct/dist');
        openmct.install(openmct.plugins.LocalStorage());
        openmct.install(openmct.plugins.MyItems());
        openmct.install(openmct.plugins.UTCTimeSystem());
        openmct.install(openmct.plugins.Espresso());
        openmct.install(TrustLedgerPlugin('data/trust_ledger.json'));
        fetch('data/trust_ledger.json').then(r => r.json()).then((d) => {
            openmct.time.timeSystem('utc', {
                start: d.time_bounds.start,
                end: d.time_bounds.end
            });
            openmct.start();
        });
    </script>
</body>
</html>
