# MetaCoin protocol packaging — ADDITIVE only. The repository layout (flat
# protocol/ + demo/ package dirs, PEP 420 namespace-style, no __init__.py) is
# unchanged: setuptools is pointed at the existing directories, never the other
# way round. Zero runtime dependencies BY DESIGN — the protocol is stdlib-only,
# and an install must work where only the standard library exists.
#
# VERSION SOURCE OF TRUTH: metacoin_cli/__init__.py::__version__ (single
# source; this file declares version as dynamic and reads it from there).
#
# Research-stage, zero-value, no token. Not consensus, not payment.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "metacoin-protocol"
dynamic = ["version"]
description = "The credibly neutral money-and-work protocol for the Space Machine Economy — research-stage, zero-value, no token; installable verifier with the complete anchored evidence corpus."
readme = "README.md"
# >=3.12: the 3.9 CI floor-test failed real checks (deterministic-sampling
# fixture + full-run layers) — we claim exactly what CI tests. The macOS
# incident machine ran 3.9.6; its concentration-layer failure was this
# version class, not the negative-zero bug (both anchored: idx 67).
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
authors = [{ name = "MetaCoin-Lab" }]
# ZERO runtime dependencies — stdlib only (a hard protocol constraint).
dependencies = []
keywords = ["verification", "ledger", "reproducibility", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/MetacoinLab/metacoin"

[project.scripts]
metacoin = "metacoin_cli.main:main"

[tool.setuptools]
# Explicit package list over the EXISTING flat layout — no files move. The
# protocol/ and demo/ dirs are PEP 420 namespace-style (no __init__.py);
# listing them explicitly packages them as-is. mip/ ships the same way (data
# only): anchored MIP decisions pin the cited file's sha256, so a
# pip-installed verifier needs the files to re-derive the governance layer.
packages = ["metacoin_cli", "protocol", "demo", "demo.tasks", "mip"]

[tool.setuptools.dynamic]
version = { attr = "metacoin_cli.__version__" }

[tool.setuptools.package-data]
# The complete verification corpus ships IN the package: a pip-installed
# metacoin with no repo checkout still fully verifies (published snapshot +
# committed tip anchor + the privacy-checked evidence bundle).
protocol = [
    "ledger_published.json",
    "ledger_anchor.json",
    "verifier_submission.schema.json",
    "evidence/*.json",
]
# Governance corpus: the MIP documents whose sha256s anchored decision
# records pin — required for the governance layer to re-derive off-repo.
mip = ["*.md"]
