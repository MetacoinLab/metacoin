{% extends "base.html" %}{% block body %}
<h1>Missions</h1>
<div class="card"><h2>Build a mission from an executable template</h2><form method="post" action="/console/missions"><input type="hidden" name="csrf" value="{{ principal.session.csrf }}"><label for="tp">template</label><select id="tp" name="template">{% for k, v in templates.items() %}<option value="{{ k }}">{{ k }} — {{ v }}</option>{% endfor %}</select> <label for="pr">price</label><input id="pr" name="price" type="number" min="1" value="40"> <label for="vf">verifier pay-to account</label><input id="vf" name="verifier_pay_to" placeholder="na_..."> <label for="mr">min cash reserve</label><input id="mr" name="min_cash_reserve" type="number" min="0" value="0"> <button type="submit">Create and freeze</button></form></div>
<div class="card"><h2>Missions</h2><div class="tablewrap"><table><tr><th>mission</th><th>title</th><th>state</th><th>revision</th><th>owner account</th></tr>{% for m in items %}<tr><td><a href="/console/missions/{{ m.id }}"><code>{{ m.id }}</code></a></td><td>{{ m.title }}</td><td><span class="badge">{{ m.state }}</span></td><td>{{ m.revision }}</td><td><code>{{ m.owner_account }}</code></td></tr>{% else %}<tr><td colspan="5">none</td></tr>{% endfor %}</table></div></div>
{% endblock %}
