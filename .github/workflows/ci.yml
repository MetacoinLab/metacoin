# CI for the demo and protocol self-tests.
#
# Research-stage. Runs the standard-library self-tests on every push and pull
# request to main: the demo suite (demo/run_all_selftests.sh) and the protocol
# suite (protocol/run_protocol_selftests.sh). In the selftests job no
# dependencies are installed — the protocol is pure Python 3 standard library,
# so that job intentionally has no pip step. A failure in EITHER suite fails
# the build.
#
# A SEPARATE, optional job (inspect-adapter) exercises the Inspect integration
# under integrations/inspect/ — the one place in the repo with a third-party
# dependency (inspect-ai), deliberately outside the protocol's zero-dependency
# boundary. The protocol jobs never install it and never import it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selftests:
    runs-on: ubuntu-latest
    strategy:
      # Test what we claim: requires-python is >=3.12 and CI tests exactly
      # that. (A 3.9 floor-test failed real checks — sampling fixture +
      # full-run layers — so 3.9 support was withdrawn, not papered over.)
      matrix:
        python-version: ["3.12"]
    steps:
      # Check out the repository so the demo and protocol scripts are available.
      - name: Checkout
        uses: actions/checkout@v5

      # Provide a recent stable Python 3 (no packages installed).
      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Run all demo self-tests through the single runner.
      - name: Run demo self-tests
        run: bash demo/run_all_selftests.sh

      # Run all protocol self-tests through the single runner. `if: always()` lets
      # this suite run (and report) even if the demo suite failed; the job still
      # fails overall if either suite failed.
      - name: Run protocol self-tests
        if: always()
        run: bash protocol/run_protocol_selftests.sh

      # The task laws (MIP-0008 discipline, MIP-0009 contract): every registered
      # task module is linted; modules the chain referenced before the law are
      # grandfathered BY ERA (never by name) and skipped; bound modules must be
      # clean. This is the task-addition gate — a new module fails here first.
      - name: Task-law check (MIP-0008 / MIP-0009)
        if: always()
        run: python3 protocol/task_law_check.py --check

      # Guard: the protocol self-tests must use temp files only and never create the
      # default runtime ledger or a real signing key. Fail the build if a stray ledger
      # file OR any protocol secret key (protocol/*.secret) is left behind.
      # (The inspect-adapter job below never runs in this job's environment, so this
      # guard also re-proves the protocol suites need no third-party packages.)
      - name: Verify no stray ledger or key files
        if: always()
        run: |
          status=0
          if [ -f protocol/ledger_data.jsonl ]; then
            echo "ERROR: protocol/ledger_data.jsonl was created by the self-tests (should use a temp file only)."
            status=1
          else
            echo "OK: no stray protocol/ledger_data.jsonl."
          fi
          strays=$(find protocol -maxdepth 1 -name '*.secret' 2>/dev/null)
          if [ -n "$strays" ]; then
            echo "ERROR: stray protocol secret key file(s) left behind (self-tests must use a temp key):"
            echo "$strays"
            status=1
          else
            echo "OK: no stray protocol/*.secret key files."
          fi
          exit $status

  # OPTIONAL integration job: the Inspect adapter (integrations/inspect/).
  # This is the ONLY CI job that installs a third-party package (inspect-ai),
  # and it is deliberately separate from the selftests job so the protocol's
  # zero-dependency claim stays tested exactly as stated. What this job can
  # honestly exercise: the no-model smoke path — dataset build, reference
  # solver, and the bit-exact re-derivation scorer agreeing 18/18 with the
  # reference implementations (both honest negatives included). It does NOT
  # evaluate any model (no API keys in CI, by design).
  inspect-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The stdlib-only integrations layer (shared scoring core + the HAL
      # benchmark package) needs no third-party packages — its self-tests run
      # BEFORE any pip install, proving that boundary on every build.
      - name: Integrations core + HAL package self-tests (stdlib-only)
        run: |
          python3 integrations/core.py
          python3 integrations/hal/metacoin_benchmark.py --selftest
          python3 integrations/baselines/run_baseline.py --selftest
          python3 integrations/baselines/run_baseline.py --estimate
          python3 integrations/openmct/generate_view_data.py --selftest
          python3 protocol/status_board_svg.py --selftest
          python3 protocol/hero_svg.py --selftest
          python3 protocol/build_hf_dataset.py --selftest

      # The trust-ledger console (integrations/openmct/): npm-installs the
      # pinned Open MCT release and syntax-checks the plugin — a network
      # failure never fails the build (the console is optional, like the
      # inspect adapter); a real generator/plugin defect DOES fail above.
      - name: Trust-ledger console npm build (optional dependency)
        continue-on-error: true
        run: |
          node --check integrations/openmct/plugin.js
          python3 integrations/openmct/generate_view_data.py
          npm install --prefix integrations/openmct --no-audit --no-fund

      # If PyPI is unreachable the install fails without failing the build:
      # the smoke step below then prints SKIPPED and exits 0 (the adapter is
      # optional; its absence is never a failure of the protocol). A real
      # smoke failure with inspect-ai installed DOES fail the build.
      - name: Install inspect-ai (optional dependency)
        continue-on-error: true
        run: pip install inspect-ai

      - name: Run adapter smoke (every roster task or SKIPPED)
        run: python3 integrations/inspect/metacoin_tasks.py --smoke
