# hf-sync: publish the dataset package to the Hugging Face Hub — but only
# when the chain-anchored content actually changed, and only after the full
# self-test battery is green in THIS workflow run (the sync job `needs:` it).
# The token is provided solely via the HF_TOKEN env from the repository
# secret of the same name and is never echoed; if the secret is unset the
# upload step reports SKIPPED and exits 0.
#
# Version rule (computed against the Hub's live manifest.json):
#   task count changed              -> minor bump (X.Y.Z -> X.Y+1.0)
#   any task spec/output hash moved -> patch bump (X.Y.Z -> X.Y.Z+1)
#   nothing changed                 -> skip with a log line
name: hf-sync

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  selftests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Protocol + demo self-test suites
        run: |
          bash protocol/run_protocol_selftests.sh
          bash demo/run_all_selftests.sh

      - name: Dataset builder self-test
        run: python3 protocol/build_hf_dataset.py --selftest

  sync:
    runs-on: ubuntu-latest
    needs: selftests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Gate — compare against the Hub's published manifest
        id: gate
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request, urllib.error
          sys.path.insert(0, ".")
          from protocol.build_hf_dataset import build_package
          HUB = ("https://huggingface.co/datasets/metacoin-lab/"
                 "metacoin-tasks/raw/main/manifest.json")
          local = build_package("/tmp/hf_gate_pkg")
          def keyset(m):
              return sorted((t["task_id"], t["spec_sha256"],
                             t["canonical_output_sha256"])
                            for t in m["tasks"])
          try:
              with urllib.request.urlopen(HUB, timeout=30) as r:
                  hub = json.load(r)
          except (urllib.error.URLError, ValueError) as exc:
              print(f"Hub manifest unavailable ({exc}) — treating as first "
                    "publish at the builder's default version")
              hub = None
          if hub is None:
              should, version, reason = True, local["version"], "first publish"
          elif (hub.get("task_count") == local["task_count"]
                  and keyset(hub) == keyset(local)):
              should, version = False, hub.get("version", "?")
              reason = (f"task count ({local['task_count']}) and every "
                        "task hash match the published manifest")
          else:
              x, y, z = (int(p) for p in hub["version"].split("."))
              if hub.get("task_count") != local["task_count"]:
                  version = f"{x}.{y + 1}.0"
                  reason = (f"task count {hub.get('task_count')} -> "
                            f"{local['task_count']} (minor bump)")
              else:
                  version = f"{x}.{y}.{z + 1}"
                  reason = "task hash(es) changed (patch bump)"
              should = True
          if should:
              print(f"SYNC: {reason} — publishing v{version}")
          else:
              print(f"SKIP: {reason} — nothing to sync")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"should_sync={'true' if should else 'false'}\n")
              f.write(f"version={version}\n")
              f.write(f"task_count={local['task_count']}\n")
              f.write(f"negative_count={local['honest_negative_count']}\n")
          EOF

      - name: Build the package at the decided version
        if: steps.gate.outputs.should_sync == 'true'
        run: |
          python3 protocol/build_hf_dataset.py --out /tmp/hf_pkg \
            --version "${{ steps.gate.outputs.version }}"

      - name: Verify the built package (must re-derive N/N)
        if: steps.gate.outputs.should_sync == 'true'
        run: |
          n="${{ steps.gate.outputs.task_count }}"
          python3 /tmp/hf_pkg/verify_tasks.py | tee /tmp/verify_out.txt
          grep -q "^${n}/${n} tasks re-derived to the recorded hashes.$" \
            /tmp/verify_out.txt
          find /tmp/hf_pkg -name "__pycache__" -type d -exec rm -rf {} + || true
          test ! -e /tmp/hf_pkg/submission_checklist.md

      - name: Upload to the Hub
        if: steps.gate.outputs.should_sync == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "SKIPPED: repository secret HF_TOKEN is not set — no upload attempted"
            exit 0
          fi
          pip install -q huggingface_hub
          v="${{ steps.gate.outputs.version }}"
          n="${{ steps.gate.outputs.task_count }}"
          k="${{ steps.gate.outputs.negative_count }}"
          msg="v${v}: ${n} tasks / ${k} honest negatives — synced from ${GITHUB_SHA:0:8}"
          hf upload metacoin-lab/metacoin-tasks /tmp/hf_pkg . \
            --repo-type dataset --commit-message "$msg"
          echo "uploaded: $msg"
