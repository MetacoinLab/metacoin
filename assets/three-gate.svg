<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="100%" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="MetaCoin three-gate verification stack">
  <defs>
    <linearGradient id="tg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1430"/>
      <stop offset="100%" stop-color="#050a1c"/>
    </linearGradient>
    <marker id="tg-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5b6680" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="720" height="600" rx="16" fill="url(#tg-bg)"/>
  <rect x="0.5" y="0.5" width="719" height="599" rx="16" fill="none" stroke="#1e2a4a" stroke-width="1"/>
  <text x="36" y="44" fill="#e6edf5" font-size="18" font-weight="600">Proof-of-Useful-Space-Work — three gates</text>
  <text x="36" y="66" fill="#7e8aa3" font-size="13">Treasury only. All three required. Integrity ≠ reproducibility ≠ usefulness.</text>
  <rect x="260" y="90" width="200" height="40" rx="8" fill="#161a26" stroke="#3a4256" stroke-width="0.75"/>
  <text x="360" y="115" fill="#aeb6c6" font-size="13" font-weight="600" text-anchor="middle">Submission</text>
  <line x1="360" y1="130" x2="360" y2="150" stroke="#5b6680" stroke-width="1.25" marker-end="url(#tg-arr)"/>
  <rect x="200" y="152" width="320" height="50" rx="8" fill="#1c1530" stroke="#534ab7" stroke-width="1"/>
  <text x="360" y="174" fill="#afa9ec" font-size="13" font-weight="600" text-anchor="middle">Compliance</text>
  <text x="360" y="191" fill="#7d77c0" font-size="11.5" text-anchor="middle">inputs/code public-domain or verified open-source</text>
  <line x1="360" y1="202" x2="360" y2="222" stroke="#5b6680" stroke-width="1.25" marker-end="url(#tg-arr)"/>
  <rect x="170" y="224" width="380" height="50" rx="8" fill="#0b2034" stroke="#185fa5" stroke-width="1"/>
  <text x="360" y="246" fill="#85b7eb" font-size="13" font-weight="600" text-anchor="middle">Gate 1 — Integrity</text>
  <text x="360" y="263" fill="#5f8fc4" font-size="11.5" text-anchor="middle">vendor-agnostic TEE attestation and/or deterministic re-run</text>
  <line x1="360" y1="274" x2="360" y2="294" stroke="#5b6680" stroke-width="1.25" marker-end="url(#tg-arr)"/>
  <rect x="170" y="296" width="380" height="50" rx="8" fill="#0b2034" stroke="#185fa5" stroke-width="1"/>
  <text x="360" y="318" fill="#85b7eb" font-size="13" font-weight="600" text-anchor="middle">Gate 2 — Reproducibility</text>
  <text x="360" y="335" fill="#5f8fc4" font-size="11.5" text-anchor="middle">re-run and compare hashes · verifying ≪ generating</text>
  <line x1="360" y1="346" x2="360" y2="366" stroke="#5b6680" stroke-width="1.25" marker-end="url(#tg-arr)"/>
  <rect x="170" y="368" width="380" height="50" rx="8" fill="#0b2034" stroke="#185fa5" stroke-width="1"/>
  <text x="360" y="390" fill="#85b7eb" font-size="13" font-weight="600" text-anchor="middle">Gate 3 — Usefulness</text>
  <text x="360" y="407" fill="#5f8fc4" font-size="11.5" text-anchor="middle">optimistic oracle · council judges only challenges</text>
  <line x1="360" y1="418" x2="360" y2="438" stroke="#5b6680" stroke-width="1.25" marker-end="url(#tg-arr)"/>
  <rect x="220" y="440" width="280" height="50" rx="8" fill="#0e2018" stroke="#1d9e75" stroke-width="1"/>
  <text x="360" y="462" fill="#5dcaa5" font-size="13" font-weight="600" text-anchor="middle">Treasury settlement</text>
  <text x="360" y="479" fill="#3f8f74" font-size="11.5" text-anchor="middle">passport updated · useful-work-per-watt recorded</text>
  <rect x="566" y="224" width="120" height="194" rx="9" fill="#241a06" stroke="#854f0b" stroke-width="0.75"/>
  <text x="626" y="252" fill="#fac775" font-size="11.5" font-weight="600" text-anchor="middle">attestation</text>
  <text x="626" y="269" fill="#fac775" font-size="11.5" font-weight="600" text-anchor="middle">is 1 of 3</text>
  <text x="626" y="296" fill="#a9781f" font-size="11" text-anchor="middle">proves it</text>
  <text x="626" y="312" fill="#a9781f" font-size="11" text-anchor="middle">ran — not</text>
  <text x="626" y="328" fill="#a9781f" font-size="11" text-anchor="middle">that it's</text>
  <text x="626" y="344" fill="#a9781f" font-size="11" text-anchor="middle">useful</text>
  <text x="626" y="372" fill="#a9781f" font-size="11" text-anchor="middle">cheap gates</text>
  <text x="626" y="388" fill="#a9781f" font-size="11" text-anchor="middle">run first</text>
  <text x="360" y="528" fill="#5b6680" font-size="11.5" text-anchor="middle">A signed enclave proves a workload ran untampered; it does not prove the result was useful.</text>
  <text x="360" y="548" fill="#5b6680" font-size="11.5" text-anchor="middle">Minting on "signed = valid" just moves the sybil attack up a level — so MetaCoin refuses to.</text>
</svg>
