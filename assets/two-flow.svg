<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="MetaCoin two-flow isolation">
  <defs>
    <linearGradient id="tf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1430"/>
      <stop offset="100%" stop-color="#050a1c"/>
    </linearGradient>
  </defs>
  <rect width="720" height="360" rx="16" fill="url(#tf-bg)"/>
  <rect x="0.5" y="0.5" width="719" height="359" rx="16" fill="none" stroke="#1e2a4a" stroke-width="1"/>
  <text x="36" y="44" fill="#e6edf5" font-size="18" font-weight="600">Two-flow isolation</text>
  <text x="36" y="66" fill="#7e8aa3" font-size="13">Subjective judgment can never mint base supply.</text>
  <rect x="36" y="88" width="312" height="150" rx="12" fill="#0e2018" stroke="#1d9e75" stroke-width="1"/>
  <text x="56" y="116" fill="#5dcaa5" font-size="14" font-weight="600">Flow 1 — Base emission</text>
  <text x="56" y="135" fill="#3f8f74" font-size="12">objective only · Bitcoin-like</text>
  <rect x="56" y="150" width="272" height="32" rx="7" fill="#0a2c22" stroke="#155c44" stroke-width="0.75"/>
  <text x="70" y="170" fill="#9fe1cb" font-size="11.5">infra uptime · liquidity · proof-of-humanity</text>
  <rect x="56" y="190" width="272" height="32" rx="7" fill="#161a26" stroke="#3a4256" stroke-width="0.75"/>
  <text x="70" y="210" fill="#aeb6c6" font-size="11.5">mints → 1.81B cap · 5-year halving</text>
  <rect x="372" y="88" width="312" height="150" rx="12" fill="#241a06" stroke="#ba7517" stroke-width="1"/>
  <text x="392" y="116" fill="#ef9f27" font-size="14" font-weight="600">Flow 2 — MetaStar Treasury</text>
  <text x="392" y="135" fill="#a9781f" font-size="12">fee-funded · bounded</text>
  <rect x="392" y="150" width="272" height="32" rx="7" fill="#2e2208" stroke="#6a4a12" stroke-width="0.75"/>
  <text x="406" y="170" fill="#fac775" font-size="11.5">funded only by protocol-usage fees</text>
  <rect x="392" y="190" width="272" height="32" rx="7" fill="#161a26" stroke="#3a4256" stroke-width="0.75"/>
  <text x="406" y="210" fill="#aeb6c6" font-size="11.5">bounties: research · robotics · sims</text>
  <line x1="360" y1="96" x2="360" y2="230" stroke="#a32d2d" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="36" y="262" width="648" height="40" rx="9" fill="#241011" stroke="#a32d2d" stroke-width="1"/>
  <text x="360" y="287" fill="#f09595" font-size="12.5" font-weight="600" text-anchor="middle">The invariant: a failed bounty drains only the treasury — never the monetary base.</text>
  <text x="360" y="332" fill="#5b6680" font-size="11.5" text-anchor="middle">A valid block hash is cheap to verify (objective). Judging "usefulness" needs judgment (bounded to the treasury).</text>
</svg>
