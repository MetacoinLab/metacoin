<text x="300" y="96" font-size="34" fill="#e6edf3" text-anchor="start" font-weight="bold"><tspan x="300" dy="0">The credibly neutral money-and-work protocol</tspan><tspan x="300" dy="44">for the Space Machine Economy.</tspan></text>
<text x="300" y="190" font-size="21" fill="#ffc23a" text-anchor="start" font-style="italic">Money for machines building the stars.</text>
<path d="M 60,332 Q 700,222 1340,332" fill="none" stroke="#5c6f82" stroke-width="1" stroke-dasharray="3 5"/>
<g data-stage="GOLD"><rect x="110" y="292" width="380" height="110" rx="8" fill="#141a23" stroke="#2a3442"/><polygon points="124,358 184,358 176,338 132,338" fill="none" stroke="#ffc23a" stroke-width="2.5" stroke-linejoin="round"/><polygon points="132,338 176,338 170,326 138,326" fill="none" stroke="#ffc23a" stroke-width="2.5" stroke-linejoin="round"/><text x="206" y="336" font-size="18" fill="#e6edf3" text-anchor="start" letter-spacing="3">GOLD</text><text x="206" y="362" font-size="12" fill="#9aa7b3" text-anchor="start"><tspan x="206" dy="0">the money of the old world</tspan></text></g>
<g data-stage="BITCOIN"><rect x="510" y="292" width="380" height="110" rx="8" fill="#141a23" stroke="#2a3442"/><rect x="532" y="322" width="40" height="40" fill="none" stroke="#e6edf3" stroke-width="2.5"/><rect x="542" y="332" width="40" height="40" fill="none" stroke="#9aa7b3" stroke-width="1.5" stroke-dasharray="4 3"/><text x="606" y="336" font-size="18" fill="#e6edf3" text-anchor="start" letter-spacing="3">BITCOIN</text><text x="606" y="362" font-size="12" fill="#9aa7b3" text-anchor="start"><tspan x="606" dy="0">the money of the digital world</tspan></text></g>
<g data-stage="METACOIN"><rect x="910" y="292" width="380" height="110" rx="8" fill="#141a23" stroke="#2a3442"/><circle cx="954" cy="344" r="6" fill="#ffc23a"/><ellipse cx="954" cy="344" rx="30" ry="12" fill="none" stroke="#2f6bff" stroke-width="2" transform="rotate(-20 954 344)"/><circle cx="981" cy="336" r="3.5" fill="#e6edf3"/><text x="1006" y="336" font-size="18" fill="#e6edf3" text-anchor="start" letter-spacing="3">METACOIN</text><text x="1006" y="362" font-size="12" fill="#9aa7b3" text-anchor="start"><tspan x="1006" dy="0">designed to become the</tspan><tspan x="1006" dy="16">work-and-energy currency of the</tspan><tspan x="1006" dy="16">Space Machine Economy</tspan></text></g>
<text x="700" y="462" font-size="15" fill="#9aa7b3" text-anchor="middle" font-style="italic"><tspan x="700" dy="0">Gold was the money of the old world. Bitcoin became the money of the digital world.</tspan><tspan x="700" dy="22">MetaCoin is designed to become the work-and-energy currency of the Space Machine Economy.</tspan></text>
</svg>
