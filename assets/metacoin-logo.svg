    <circle r="262" fill="none" stroke="#e6edf5" stroke-width="2" stroke-dasharray="190 44 8 44" opacity="0.20"/>
    <circle cx="104" cy="-268" r="5" fill="url(#gold)" filter="url(#glow)"/>
    <circle cx="-248" cy="142" r="4" fill="#ffffff" opacity="0.85"/>
    <circle cx="198" cy="198" r="6" fill="url(#gold)"/>
    <circle cx="-150" cy="-238" r="3" fill="#9fb0c4"/>
    <circle cx="268" cy="-40" r="3" fill="#ffffff" opacity="0.7"/>
    <path d="M 0,-332 L 0,-292 M 0,292 L 0,332 M -332,0 L -292,0 M 292,0 L 332,0" stroke="#e6edf5" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M -158,-78 L -78,-158 L 78,-158 L 158,-78 L 158,78 L 78,158 L -78,158 L -158,78 Z" fill="none" stroke="url(#silver)" stroke-width="26" stroke-linejoin="round"/>
    <path d="M -66,72 L 0,-92 L 66,72" fill="none" stroke="url(#silver)" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -40,72 L 0,-30 L 40,72" fill="none" stroke="url(#silver)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" opacity="0.55"/>
    <g filter="url(#glow)">
      <path d="M 0,-50 Q 0,0 -50,0 Q 0,0 0,50 Q 0,0 50,0 Q 0,0 0,-50 Z" fill="url(#gold)"/>
      <path d="M 0,-30 Q 0,0 -30,0 Q 0,0 0,30 Q 0,0 30,0 Q 0,0 0,-30 Z" fill="#ffffff"/>
