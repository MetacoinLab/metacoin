<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" role="img" aria-label="MetaCoin emblem">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0a1430"/>
      <stop offset="55%" stop-color="#050a1c"/>
      <stop offset="100%" stop-color="#01040d"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f6bff" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#1b3aa0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a99ad"/>
      <stop offset="35%" stop-color="#e6edf5"/>
      <stop offset="72%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c2cdda"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="48%" stop-color="#ffc23a"/>
      <stop offset="100%" stop-color="#b8801a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="360" fill="url(#halo)"/>
  <g transform="translate(400,400)">
    <circle r="312" fill="none" stroke="#2f6bff" stroke-width="1.5" stroke-dasharray="2 16" opacity="0.45"/>
