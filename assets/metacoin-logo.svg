<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="space-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#071026" />
      <stop offset="60%" stop-color="#020612" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <radialGradient id="nebula-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00aaff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0044ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="silver-industrial" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a99ad" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="gold-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="50%" stop-color="#ffb700" />
      <stop offset="100%" stop-color="#9a6f00" />
    </linearGradient>

    <filter id="core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#space-bg)" />

  <circle cx="400" cy="400" r="350" fill="url(#nebula-glow)" />

  <g transform="translate(400, 400)">
    <circle cx="0" cy="0" r="310" fill="none" stroke="#0088ff" stroke-width="1.5" stroke-dasharray="3 15" opacity="0.4" />
    <circle cx="0" cy="0" r="290" fill="none" stroke="#64748b" stroke-width="1" opacity="0.3" />
    <circle cx="0" cy="0" r="270" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="200 40 10 40" opacity="0.2" />

    <circle cx="106" cy="-271" r="5" fill="url(#gold-spark)" filter="url(#core-glow)" />
    <circle cx="-251" cy="145" r="4" fill="#ffffff" opacity="0.8" />
    <circle cx="200" cy="200" r="6" fill="url(#gold-spark)" />
    <circle cx="-150" cy="-240" r="3" fill="#64748b" />

    <path d="M 0,-330 L 0,-290 M 0,290 L 0,330 M -330,0 L -290,0 M 290,0 L 330,0" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <path d="M -220,-220 L -190,-190 M 190,190 L 220,220 M -220,220 L -190,190 M 190,-190 L 220,-220" stroke="#00aaff" stroke-width="2" stroke-linecap="round" opacity="0.4" />

    <path d="M -160,-80 L -80,-160 L 80,-160 L 160,-80 L 160,80 L 80,160 L -80,160 L -160,80 Z" 
          fill="none" 
          stroke="url(#silver-industrial)" 
          stroke-width="26" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <path d="M -70,-70 L 0,-140 L 70,-70 L 40,70 L -40,70 Z" 
          fill="#0055ff" 
          opacity="0.1" />
          
    <path d="M -70,-70 L 0,-140 L 70,-70" fill="none" stroke="url(#silver-industrial)" stroke-width="12" stroke-linejoin="round" />
    <path d="M -40,70 L 0,-30 L 40,70" fill="none" stroke="url(#silver-industrial)" stroke-width="8" stroke-linejoin="round" opacity="0.6" />

    <path d="M -110,0 L -50,0 M 50,0 L 110,0" stroke="#00aaff" stroke-width="1" opacity="0.5" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#gold-spark)" stroke-width="1.5" stroke-dasharray="4 12" opacity="0.4" />

    <g filter="url(#core-glow)">
      <path d="M 0,-48 Q 0,0 -48,0 Q 0,0 0,48 Q 0,0 45,0 Q 0,0 0,-48 Z" fill="url(#gold-spark)" />
      <path d="M 0,-30 Q 0,0 -30,0 Q 0,0 0,30 Q 0,0 30,0 Q 0,0 0,-30 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="6" fill="#ffffff" />
    </g>
  </g>
</svg>
